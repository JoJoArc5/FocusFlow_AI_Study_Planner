<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusFlow Premium</title><style>:root{--bg:#0b1020;--card:rgba(255,255,255,.08);--txt:#fff;--accent:#8b6cff}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--txt)}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(139,108,255,.25),transparent 30%),radial-gradient(circle at 80% 30%,rgba(0,200,255,.15),transparent 30%);filter:blur(60px);z-index:-1}.wrap{max-width:1200px;margin:auto;padding:20px}.hero,.card{background:var(--card);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:24px}.hero{padding:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:16px}.card{padding:20px}.task{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}button{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:12px;cursor:pointer}.timer{font-size:48px;font-weight:bold}.heat{display:grid;grid-template-columns:repeat(14,16px);gap:4px}.cell{width:16px;height:16px;border-radius:4px;background:#1f2948}.a{background:#8b6cff}</style></head><body><div class="wrap"><div class="hero"><h1>FocusFlow Premium</h1><p>AI-inspired study dashboard</p><button onclick="addTask()">Add Task</button></div><div class="grid"><div class="card"><h3>Tasks</h3><div id="tasks"></div></div><div class="card"><h3>Focus Timer</h3><div class="timer" id="timer">25:00</div><button onclick="toggleTimer()">Start/Pause</button></div><div class="card"><h3>AI Insights</h3><p id="insight"></p></div><div class="card"><h3>Achievements</h3><ul><li>🏆 First Session</li><li>🔥 7 Day Streak</li></ul></div><div class="card"><h3>Heatmap</h3><div class="heat" id="heat"></div></div></div></div><script>let data=JSON.parse(localStorage.getItem('ffp')||'{"tasks":["Revise AI"],"minutes":0}');function save(){localStorage.setItem('ffp',JSON.stringify(data))}function render(){tasks.innerHTML=data.tasks.map((t,i)=>`<div class=task>${t}<button onclick="done(${i})">✓</button></div>`).join('');insight.textContent=data.minutes<60?'Focus on your hardest subject today':'Great consistency this week';heat.innerHTML='';for(let i=0;i<98;i++){let d=document.createElement('div');d.className='cell'+(Math.random()>.6?' a':'');heat.appendChild(d)}}function addTask(){let t=prompt('Task');if(t){data.tasks.push(t);save();render();}}function done(i){data.tasks.splice(i,1);save();render();}let sec=1500,intv=null;function fmt(){timer.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function toggleTimer(){if(intv){clearInterval(intv);intv=null;return}intv=setInterval(()=>{if(sec>0){sec--}else{clearInterval(intv);intv=null;data.minutes+=25;save();render();alert('Session complete')}fmt()},1000)}fmt();render();document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='k'){e.preventDefault();alert('Command Palette Demo')}})</script></body></html>
